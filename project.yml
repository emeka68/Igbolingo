name: Igbolingo
options:
  bundleIdPrefix: com.emmanuelduru
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES

targets:
  Igbolingo:
    type: application
    platform: iOS
    sources:
      - path: IgboApp
    resources:
      - IgboApp/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emmanuelduru.Igbolingo
        INFOPLIST_FILE: IgboApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies: []
